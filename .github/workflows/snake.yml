name: Generar serpiente de contribuciones
 
on:
  schedule:
    - cron: "0 5 * * *" # todos los días a medianoche (hora de Bogotá)
  workflow_dispatch: # para ejecutarlo a mano desde la pestaña Actions
  push:
    branches:
      - main
 
permissions:
  contents: write
 
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar SVGs de la serpiente
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a277ff
 
      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
